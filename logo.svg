<!-- /public/logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradient principal bleu→violet -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Gradient glow intérieur -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a"  stop-opacity="0"/>
    </radialGradient>

    <!-- Filtre lueur externe -->
    <filter id="blur-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond hexagonal sombre -->
  <polygon
    points="32,2 58,17 58,47 32,62 6,47 6,17"
    fill="#0f172a"
    stroke="url(#g1)"
    stroke-width="1.5"
  />

  <!-- Glow intérieur -->
  <polygon
    points="32,2 58,17 58,47 32,62 6,47 6,17"
    fill="url(#glow)"
  />

  <!-- Réseau : lignes connectées (mini GlobalBackground) -->
  <!-- Triangle central -->
  <line x1="32" y1="18" x2="44" y2="38"
        stroke="url(#g1)" stroke-width="0.8" opacity="0.55"/>
  <line x1="32" y1="18" x2="20" y2="38"
        stroke="url(#g1)" stroke-width="0.8" opacity="0.55"/>
  <line x1="20" y1="38" x2="44" y2="38"
        stroke="url(#g1)" stroke-width="0.8" opacity="0.55"/>
  <!-- Lignes secondaires -->
  <line x1="32" y1="18" x2="32" y2="10"
        stroke="#06b6d4" stroke-width="0.6" opacity="0.4"/>
  <line x1="44" y1="38" x2="52" y2="42"
        stroke="#8b5cf6" stroke-width="0.6" opacity="0.4"/>
  <line x1="20" y1="38" x2="12" y2="42"
        stroke="#8b5cf6" stroke-width="0.6" opacity="0.4"/>

  <!-- Nœuds du réseau -->
  <!-- nœud top -->
  <circle cx="32" cy="18" r="2.8" fill="#3b82f6" filter="url(#blur-glow)" opacity="0.95"/>
  <circle cx="32" cy="18" r="1.4" fill="white"   opacity="0.9"/>
  <!-- nœud gauche -->
  <circle cx="20" cy="38" r="2.2" fill="#8b5cf6" filter="url(#blur-glow)" opacity="0.9"/>
  <circle cx="20" cy="38" r="1.1" fill="white"   opacity="0.85"/>
  <!-- nœud droit -->
  <circle cx="44" cy="38" r="2.2" fill="#06b6d4" filter="url(#blur-glow)" opacity="0.9"/>
  <circle cx="44" cy="38" r="1.1" fill="white"   opacity="0.85"/>
  <!-- nœuds satellite -->
  <circle cx="32" cy="10" r="1.4" fill="#6366f1" opacity="0.75"/>
  <circle cx="52" cy="42" r="1.2" fill="#8b5cf6" opacity="0.65"/>
  <circle cx="12" cy="42" r="1.2" fill="#3b82f6" opacity="0.65"/>

  <!-- Initiales "BG" stylisées -->
  <text
    x="32" y="53"
    text-anchor="middle"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="9"
    font-weight="700"
    letter-spacing="1.5"
    fill="url(#g1)"
    opacity="0.92"
  >BG</text>

  <!-- Bordure extérieure lumineuse -->
  <polygon
    points="32,2 58,17 58,47 32,62 6,47 6,17"
    fill="none"
    stroke="url(#g1)"
    stroke-width="0.5"
    opacity="0.4"
  />
</svg>